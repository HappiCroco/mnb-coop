name = "includes/mods/mnb_coop/coop_mods"

[[patches]]
[patches.module]
source = "coop_qminput.lua"
before = "main.lua"
name = "includes/mods/mnb_coop/coop_qminput"

[[patches]]
[patches.module]
source = "mnb_coop_main.lua"
before = "main.lua"
name = "includes/mods/mnb_coop/mnb_coop_main"

# Load last in main.lua, after love.update/keypressed/... exist, so the wrappers chain them.
[[patches]]
[patches.copy]
target = "main.lua"
position = "append"
payload = '''
require("includes/mods/mnb_coop/mnb_coop_main")
'''

# Menu buttons: right before buttonUpdateMenu's mouse-over pass, so our tooltips work.
[[patches]]
[patches.pattern]
target = "includes/urb_engine.lua"
pattern = '''
--love.system.openURL("http://love2d.org/")

-- mouse over code
activeButton = 0
'''
position = "before"
payload = '''
if mnbCoop then mnbCoop.registerMenuButtons() end
'''
match_indent = true
times = 1

# Menu drawing: right before drawState1 draws the tooltip, so tooltips stay on top.
[[patches]]
[patches.pattern]
target = "includes/drawFiles.lua"
pattern = '''
if(mouseOverText ~= "") then
local thisx =  love.mouse.getX()
'''
position = "before"
payload = '''
if mnbCoop then mnbCoop.drawMenu() end
'''
match_indent = true
times = 1

# Battle: a ring in the owner's seat colour under each co-op squad soldier, drawn
# in the game's troop loop right before its white selection ring.
[[patches]]
[patches.pattern]
target = "includes/drawFiles.lua"
pattern = '''
if(player.deployedTroops[i].selected == true) then
love.graphics.setColor( love.math.colorFromBytes(255, 255, 255, 50))
love.graphics.draw( selectionCircle, player.deployedTroops[i].x, player.deployedTroops[i].y, 0, 1 + (selectCircle/10)*
'''
position = "before"
payload = '''
if mnbCoop and mnbCoop.squad then mnbCoop.squad.drawOwnerRing(soldier) end
'''
match_indent = true
times = 1

# Co-op defense: a soldier on a tactical withdrawal (tacDraw) walks to the left edge
# every frame here (ai.lua:1690); in the defense he leaves by the nearest top/bottom
# edge instead (coop_defense.lua, defense.withdraw).
[[patches]]
[patches.pattern]
target = "includes/ai.lua"
pattern = '''
if(player.deployedTroops[i].tacDraw > 0) then
player.deployedTroops[i].targetx = -500
'''
position = "after"
payload = '''
if mnbCoop and mnbCoop.defense then mnbCoop.defense.withdraw(player.deployedTroops[i]) end
'''
match_indent = true
times = 1

# Co-op defense: a panicking soldier (morale 0, ai.lua:5715) runs a screen to the left; in the
# defense he runs to the radar instead (coop_defense.lua, defense.panicked).
[[patches]]
[patches.pattern]
target = "includes/ai.lua"
pattern = '''
soldier.targetx = soldier.targetx - 1280
'''
position = "after"
payload = '''
if mnbCoop and mnbCoop.defense then mnbCoop.defense.panicked(soldier) end
'''
match_indent = true
times = 1

# Co-op defense: German vehicles from the left too (coop_defense.lua, "German vehicles
# from both sides"). vehicleUpdate backs a German vehicle up, facing left, when its target
# is to the right (5 tests, ai.lua:3403-3534); for a left one, backing up is to the left,
# facing right. Each payload falls back to the game's own rule without the co-op.
[[patches]]
[patches.regex]
target = "includes/ai.lua"
pattern = '(?P<c>player\.deployedVehicles\[i\]\.targetx > player\.deployedVehicles\[i\]\.x) and player\.deployedVehicles\[i\]\.faction == "axis"'
root_capture = "c"
position = "at"
payload = '(coopVehicleBacks == nil and player.deployedVehicles[i].targetx > player.deployedVehicles[i].x or coopVehicleBacks ~= nil and coopVehicleBacks(player.deployedVehicles[i]))'

# ...the backing-up move itself: x + speed for the right, x - speed for the left
[[patches]]
[patches.regex]
target = "includes/ai.lua"
pattern = 'player\.deployedVehicles\[i\]\.x = player\.deployedVehicles\[i\]\.x \+ (?P<s>\(currentSpeed \* dt\))'
root_capture = "s"
position = "at"
payload = '((coopVehicleBackSign and coopVehicleBackSign(player.deployedVehicles[i]) or 1) * currentSpeed * dt)'

# ...and the facing while backing up: left (90) for the right, right (270) for the left
[[patches]]
[patches.regex]
target = "includes/ai.lua"
pattern = 'player\.deployedVehicles\[i\]\.intendedRotation = (?P<r>math\.rad\(90\))'
root_capture = "r"
position = "at"
payload = '(coopVehicleBackRot and coopVehicleBackRot(player.deployedVehicles[i]) or math.rad(90))'

# ---------------------------------------------------------------------------
# Co-op campaign squad: the 6 are shared out now; above-6 squads (4 players x 3,
# later) need these. The game's "6" squad checks ask coopSquadMax() instead; it
# returns 6 except during a co-op campaign with a bigger squad.
# ---------------------------------------------------------------------------

# Dead-soldier replacement scans (bcReplacement, ribReplacement, alarmReplacement,
# the replace skill) look at slots 1..6 only.
[[patches]]
[patches.pattern]
target = ["includes/bcChecks.lua", "includes/urb_engine.lua"]
pattern = '''
for i=1, 6, 1 do
if(player.deployedTroops[i].dead > 0) then
'''
position = "at"
payload = '''
for i=1, (coopSquadMax and coopSquadMax() or 6), 1 do
  if(player.deployedTroops[i].dead > 0) then
'''
match_indent = true

# Alarm replacement only while the squad is below full.
[[patches]]
[patches.regex]
target = "includes/urb_engine.lua"
pattern = 'playerControlled > 0 and squadSize\(\) < (?P<n>6)\) then'
root_capture = "n"
position = "at"
payload = "(coopSquadMax and coopSquadMax() or 6)"

# Size control (classic big-squad punishment: random artillery, WP, airbursts,
# strafes) starts above a full squad; co-op Classic with teammates: above 12 (owner,
# 2026-11-11: "three for each player"). See coopSizeLimit in mnb_coop_main.lua.
[[patches]]
[patches.regex]
target = "includes/urb_engine.lua"
pattern = 'if\(squadSizer\(\) > (?P<n>6)\) then'
root_capture = "n"
position = "at"
payload = "(coopSizeLimit and coopSizeLimit() or 6)"

# Wave timer (urb_engine.lua:6084): the next Classic wave comes when deployTimer > 60 + the
# living Germans. The co-op defense twins every wave, so twice as many stand around; there the
# count is halved (coopWavePace, mnb_coop_main.lua / defense.wavePace). Without the co-op: the
# game's own totalAxis().
[[patches]]
[patches.regex]
target = "includes/urb_engine.lua"
pattern = 'if\(player\.deployTimer > 60 \+ (?P<n>totalAxis\(\))\) then'
root_capture = "n"
position = "at"
payload = "(totalAxis() / (coopWavePace and coopWavePace() or 1))"

# Crowd control after wave 100 (mnb2.lua:639): a (squad - 12)% chance per wave of a Combined
# Force (tanks and troops). Counts soldiers and crewed guns/vehicles, camo nets or not. The game's
# 12 is twice one player's 6; co-op Classic: twice its 12 (owner, 2026-11-12: "if they scale with
# the number of soldiers... the doubling explodes the numbers").
[[patches]]
[patches.regex]
target = "includes/mnb2.lua"
pattern = 'randNbr\(100\) < \(realSquadSizer\(\) -(?P<n>12)\)'
root_capture = "n"
position = "at"
payload = "(coopSizeLimit and coopSizeLimit() * 2 or 12)"

# ...and it gets ten times as likely above twice that (the game's 12; co-op: 24).
[[patches]]
[patches.regex]
target = "includes/urb_engine.lua"
pattern = 'if\(funkMasterFlex > (?P<n>12)\) then'
root_capture = "n"
position = "at"
payload = "(coopSizeLimit and coopSizeLimit() * 2 or 12)"

# "Full squad" voice line.
[[patches]]
[patches.regex]
target = "includes/urb_engine.lua"
pattern = 'elseif\(squadSize\(\) == (?P<n>6)\) then'
root_capture = "n"
position = "at"
payload = "(coopSquadMax and coopSquadMax() or 6)"

# Damage bonus for missing squad members counts from a full squad.
[[patches]]
[patches.regex]
target = "includes/urb_engine.lua"
pattern = 'soldierMissing = 1\+\(\(\((?P<n>6)-squadSize\(\)\)\*5\)/100\)'
root_capture = "n"
position = "at"
payload = "(coopSquadMax and coopSquadMax() or 6)"

# Debrief: full-squad XP doubling and full honour.
[[patches]]
[patches.regex]
target = "includes/urb_engine.lua"
pattern = 'if\(squadSize\(\) >= (?P<n>6)\) ?then'
root_capture = "n"
position = "at"
payload = "(coopSquadMax and coopSquadMax() or 6)"

# Debrief: "5+ alive" check.
[[patches]]
[patches.regex]
target = "includes/urb_engine.lua"
pattern = 'if\(squadSize\(\) >= (?P<n>5)\)then'
root_capture = "n"
position = "at"
payload = "(coopSquadMax and coopSquadMax() - 1 or 5)"

# Battle condition 50: "keep the whole team alive".
[[patches]]
[patches.regex]
target = "includes/bcChecks.lua"
pattern = 'player\.bcModTeamCap = (?P<n>6)'
root_capture = "n"
position = "at"
payload = "(coopSquadMax and coopSquadMax() or 6)"

# Mud and Blood Co-op. Standalone; QuarterMaster 1.8's menu (or the old GMenu) gives it an options page and page numbers.
[manifest]
version = "1.1.2"
priority = 80

# For QuarterMaster's mod list (Mods > Browse); the game ignores it.
[publish]
repository = "HappiCroco/mnb-coop"
asset = "mnb_coop.zip"
summary = "Co-op for up to 3 players: shared campaign with your own rosters, and a Classic defense around a radar."
channel = "stable"

[[patches]]
[patches.module]
source = "coop_codec.lua"
before = "main.lua"
name = "includes/mods/mnb_coop/coop_codec"

[[patches]]
[patches.module]
source = "coop_profile.lua"
before = "main.lua"
name = "includes/mods/mnb_coop/coop_profile"

[[patches]]
[patches.module]
source = "coop_net.lua"
before = "main.lua"
name = "includes/mods/mnb_coop/coop_net"

[[patches]]
[patches.module]
source = "coop_campaign.lua"
before = "main.lua"
name = "includes/mods/mnb_coop/coop_campaign"

[[patches]]
[patches.module]
source = "coop_battle.lua"
before = "main.lua"
name = "includes/mods/mnb_coop/coop_battle"

[[patches]]
[patches.module]
source = "coop_wallet.lua"
before = "main.lua"
name = "includes/mods/mnb_coop/coop_wallet"

[[patches]]
[patches.module]
source = "coop_steam.lua"
before = "main.lua"
name = "includes/mods/mnb_coop/coop_steam"

[[patches]]
[patches.module]
source = "coop_squad.lua"
before = "main.lua"
name = "includes/mods/mnb_coop/coop_squad"

[[patches]]
[patches.module]
source = "coop_defense.lua"
before = "main.lua"
name = "includes/mods/mnb_coop/coop_defense"

[[patches]]
[patches.module]
source = "coop_ribbons.lua"
before = "main.lua"
name = "includes/mods/mnb_coop/coop_ribbons"

[[patches]]
[patches.module]
source = "coop_window.lua"
before = "main.lua"
name = "includes/mods/mnb_coop/coop_window"

[[patches]]
[patches.module]
source = "coop_lobby.lua"
before = "main.lua"
name = "includes/mods/mnb_coop/coop_lobby"

[[patches]]
[patches.module]
source = "coop_hud.lua"
before = "main.lua"
name = "includes/mods/mnb_coop/coop_hud"

[[patches]]
[patches.module]
source = "coop_mods.lua"
